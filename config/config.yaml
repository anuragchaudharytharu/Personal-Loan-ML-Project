artifacts_root: artifacts


data_ingestion:
  root_dir: artifacts/data_ingestion
  source_URL: https://raw.githubusercontent.com/anuragchaudharytharu/Data-Files/main/Bank%20Personal%20Loan/Bank_Personal_Loan_Modelling.csv
  local_data_file: artifacts/data_ingestion/data.csv
  train_data_path: artifacts/data_ingestion/train.csv
  test_data_path: artifacts/data_ingestion/test.csv


data_validation:
  root_dir: artifacts/data_validation
  status_file: artifacts/data_validation/status.txt


data_transformation:
  root_dir: artifacts/data_transformation
  preprocessor_obj_file_path: artifacts/data_transformation/preprocessor.pkl
  outlier_method: iqr  # Options: "iqr" or "zscore"
  outlier_threshold: 1.5  # For IQR: 1.5 (standard), 3.0 (conservative)


model_trainer:
  root_dir: artifacts/model_trainer
  model_path: artifacts/model_trainer/model.pkl
  params_path: config/params.yaml
  train_data_path: artifacts/data_transformation/train.npy
  test_data_path: artifacts/data_transformation/test.npy

  target_column: target

  scoring: f1
  cv: 3
  n_jobs: -1


model_evaluation:
  root_dir: artifacts/model_evaluation
  test_data_path: artifacts/data_transformation/test.npy
  model_path: artifacts/model_trainer/model.pkl
  metric_file_name: metrics.json
  baseline_f1_score: 0.8
  baseline_accuracy: 0.8